name: SIPW Latest Authority Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.title == 'Validate latest EIPW authority as pure SIPW'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SIPW work branch
        uses: actions/checkout@v4
        with:
          ref: sila/sipw-latest-pure-20260911
          fetch-depth: 0
          submodules: false

      - name: Mirror exact upstream authority preserving gitlink
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/eipw.git
          git fetch --depth=1 upstream 74a1df8a732f99ff7d904768d80a78e93ca1bb0f
          UPSTREAM_GITLINK="$(git ls-tree FETCH_HEAD eipw-lint/dictionaries | awk '{print $3}')"
          test -n "$UPSTREAM_GITLINK"
          echo "$UPSTREAM_GITLINK" > /tmp/upstream-gitlink
          git read-tree --reset -u FETCH_HEAD

      - name: Convert exact authority to Pure Sila identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          def binary(p):
              b=p.read_bytes()[:8192]
              if b'\x00' in b: return True
              try: b.decode('utf-8'); return False
              except UnicodeDecodeError: return True

          # Project/proposal identities are safe global identities in this repository.
          direct=[
              ('EIPW','SIPW'),('Eipw','Sipw'),('eipw','sipw'),
              ('EIPV','SIPV'),('Eipv','Sipv'),('eipv','sipv'),
              ('EIPs','SIPs'),('eips','sips'),('EIP','SIP'),('eip','sip'),
              ('ERCs','SRCs'),('ERCS','SRCS'),('IERC','ISRC'),('AERC','ASRC'),('IEIP','ISIP'),
              ('Ethereum Foundation','Sila Foundation'),('Etherscan','SilaScan'),
              ('https://github.com/ethereum/','https://github.com/sila-chain/'),
              ('github.com/ethereum/','github.com/sila-chain/'),
              ('https://ethereum.org','https://sila.org'),('ethereum.org','sila.org'),
              ('Ethereum','Sila'),('ETHEREUM','SILA'),('ethereum','sila'),
              ('WETH','WSIL'),('IWETH','IWSIL'),
          ]
          # Lowercase erc and eth require boundaries to avoid ordinary English substrings.
          token=[('ERC','SRC'),('erc','src'),('ETH','SIL'),('Eth','Sil'),('eth','sil'),('Ether','Sila'),('ether','sila')]
          rx=re.compile(r'\b(?:'+'|'.join(sorted((re.escape(a) for a,_ in token),key=len,reverse=True))+r')\b')
          tmap=dict(token)

          files=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or binary(p): continue
              files.append(p)
          for p in files:
              s=p.read_text('utf-8')
              # Preserve third-party GitHub orgs whose names merely begin with ethereum (e.g. ethereumjs).
              saved=[]
              pat=re.compile(r'https?://github\.com/(ethereum[A-Za-z0-9_.-]+)')
              def keep(m):
                  if m.group(1) != 'ethereum':
                      k=f'__SILA_THIRD_PARTY_{len(saved)}__'; saved.append((k,m.group(0))); return k
                  return m.group(0)
              s=pat.sub(keep,s)
              for a,b in direct: s=s.replace(a,b)
              s=rx.sub(lambda m:tmap[m.group(0)],s)
              for k,v in saved: s=s.replace(k,v)
              p.write_text(s,'utf-8')

          # Rename identity-bearing path components deepest-first.
          paths=sorted([p for p in root.rglob('*') if '.git' not in p.parts],key=lambda p:len(p.parts),reverse=True)
          def rename_component(n):
              n=n.replace('eipw','sipw').replace('EIPW','SIPW').replace('Eipw','Sipw')
              n=n.replace('eipv','sipv').replace('EIPV','SIPV').replace('Eipv','Sipv')
              n=n.replace('eips','sips').replace('EIPs','SIPs')
              n=re.sub(r'(?<![A-Za-z0-9])eip(?![A-Za-z0-9])','sip',n)
              n=re.sub(r'(?<![A-Za-z0-9])EIP(?![A-Za-z0-9])','SIP',n)
              n=re.sub(r'(?<![A-Za-z0-9])erc(?![A-Za-z0-9])','src',n)
              n=re.sub(r'(?<![A-Za-z0-9])ERC(?![A-Za-z0-9])','SRC',n)
              n=n.replace('ethereum','sila').replace('Ethereum','Sila').replace('ETHEREUM','SILA')
              return n
          for p in paths:
              if not p.exists(): continue
              n=rename_component(p.name)
              if n!=p.name:
                  q=p.with_name(n)
                  if q.exists(): raise SystemExit(f'PATH_COLLISION:{p}->{q}')
                  p.rename(q)
          PY

          git add -A
          UPSTREAM_GITLINK="$(cat /tmp/upstream-gitlink)"
          git update-index --force-remove eipw-lint/dictionaries 2>/dev/null || true
          git update-index --add --cacheinfo 160000,"$UPSTREAM_GITLINK",sipw-lint/dictionaries

          python3 - <<'PY'
          from pathlib import Path
          import re
          ids=['Ethereum','ethereum','ETHEREUM','EIPs','eips','EIP','eip','ERCs','ERCS','ercs','ERC','erc','ETH','Eth','eth','Ether','ether','EIPW','Eipw','eipw','EIPV','EipV','eipv']
          rx=re.compile(r'\b(?:'+'|'.join(map(re.escape,ids))+r')\b')
          residual=[]
          for p in Path('.').rglob('*'):
              if '.git' in p.parts: continue
              rel=p.as_posix()
              if rx.search(rel): residual.append('PATH:'+rel)
              if p.is_file():
                  try:s=p.read_text('utf-8')
                  except UnicodeDecodeError:continue
                  s=re.sub(r'https?://github\.com/ethereum[A-Za-z0-9_.-]+','__THIRD_PARTY__',s)
                  if rx.search(s): residual.append('TEXT:'+rel)
          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT='+str(len(residual)))
          for x in residual[:200]: print(x)
          if residual: raise SystemExit(1)
          PY

      - name: Set up Rust 1.81
        uses: dtolnay/rust-toolchain@1.81
        with:
          components: rustfmt, clippy

      - name: Initialize preserved third-party submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Cargo check
        run: cargo check --all --all-features --locked

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-features -- --deny warnings

      - name: Cargo tests no default features
        run: cargo test --all --no-default-features --locked

      - name: Cargo tests all features
        run: cargo test --all --all-features --locked

      - name: Commit and publish generated authority tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sync: latest EIPW authority 74a1df8a' || true
          git push --force origin HEAD:sila/generated-eipw-74a1df8a
