name: SIPW Latest Authority Sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.title == 'Validate latest EIPW authority as pure SIPW'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sila/sipw-latest-pure-20260911
          fetch-depth: 0
          submodules: false
      - name: Mirror exact upstream authority preserving gitlink
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/eipw.git
          git fetch --depth=1 upstream 74a1df8a732f99ff7d904768d80a78e93ca1bb0f
          G="$(git ls-tree FETCH_HEAD eipw-lint/dictionaries | awk '{print $3}')"
          test -n "$G"; printf '%s' "$G" >/tmp/gitlink
          git read-tree --reset -u FETCH_HEAD
      - name: Convert exact authority to Pure Sila identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          def binary(p):
              b=p.read_bytes()[:8192]
              if b'\0' in b:return True
              try:b.decode('utf-8');return False
              except UnicodeDecodeError:return True
          direct=[('EIPW','SIPW'),('Eipw','Sipw'),('eipw','sipw'),('EIPV','SIPV'),('Eipv','Sipv'),('eipv','sipv'),('EIPs','SIPs'),('eips','sips'),('EIP','SIP'),('eip','sip'),('ERCs','SRCs'),('ERCS','SRCS'),('ercs','srcs'),('IERC','ISRC'),('AERC','ASRC'),('IEIP','ISIP'),('Ethereum Foundation','Sila Foundation'),('Etherscan','SilaScan'),('https://github.com/ethereum/','https://github.com/sila-chain/'),('github.com/ethereum/','github.com/sila-chain/'),('https://ethereum.org','https://sila.org'),('ethereum.org','sila.org'),('Ethereum','Sila'),('ETHEREUM','SILA'),('ethereum','sila'),('WETH','WSIL'),('IWETH','IWSIL')]
          token=dict([('ERC','SRC'),('erc','src'),('ETH','SIL'),('Eth','Sil'),('eth','sil'),('Ether','Sila'),('ether','sila')])
          rx=re.compile(r'\b(?:'+'|'.join(sorted(map(re.escape,token),key=len,reverse=True))+r')\b')
          for p in list(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts or binary(p):continue
              raw=p.read_bytes(); s=raw.decode('utf-8'); saved=[]
              pat=re.compile(r'https?://github\.com/(ethereum[A-Za-z0-9_.-]+)')
              def keep(m):
                  if m.group(1)!='ethereum':
                      k=f'__SILA_TP_{len(saved)}__';saved.append((k,m.group(0)));return k
                  return m.group(0)
              s=pat.sub(keep,s)
              s=s.replace(r'github\\.com/ethereum/consensus-specs',r'github\\.com/sila-chain/consensus-specs')
              for a,b in direct:s=s.replace(a,b)
              s=re.sub(r'\bERC(?=(?:[0-9]+|N\b))','SRC',s)
              s=re.sub(r'\berc(?=(?:[0-9]+|n\b))','src',s)
              s=re.sub(r'\bEIP(?=(?:[0-9]+|N\b))','SIP',s)
              s=re.sub(r'\beip(?=(?:[0-9]+|n\b))','sip',s)
              s=rx.sub(lambda m:token[m.group(0)],s)
              for k,v in saved:s=s.replace(k,v)
              if p.as_posix()=='eipw-lint/tests/lint_markdown_relative_links.rs':
                  ls=s.splitlines(keepends=True)
                  for i in range(len(ls)-1):
                      m=re.match(r'^(\d+ \| )(.*?)(\r?\n)?$',ls[i]); c=re.match(r'^(\s*\| )(\^+)( used here)(\r?\n)?$',ls[i+1])
                      if m and c:
                          src=m.group(2); width=(src.find('>')+1) if (src.startswith('<a ') or src.startswith('<img ')) else len(src)
                          if width<=0:width=len(src)
                          ls[i+1]=c.group(1)+'^'*width+c.group(3)+(c.group(4) or '')
                  s=''.join(ls)
              if p.as_posix()=='eipw-lint/tests/eipv/preamble-title-too-long/expected.txt':
                  ls=s.splitlines(keepends=True)
                  for i in range(len(ls)-1):
                      m=re.match(r'^3 \| title: (.*?)(\r?\n)?$',ls[i]); c=re.match(r'^(\s*\|\s+)(\^+)( too long)(\r?\n)?$',ls[i+1])
                      if m and c:ls[i+1]=c.group(1)+'^'*(len(m.group(1))+1)+c.group(3)+(c.group(4) or '')
                  s=''.join(ls)
              if p.as_posix()=='eipw-lint/tests/eipv/preamble-description-too-long/expected.txt':
                  ls=s.splitlines(keepends=True)
                  for i in range(len(ls)-1):
                      m=re.match(r'^4 \| \.\.\.on: (.*?)(\r?\n)?$',ls[i]); c=re.match(r'^(\s*\|\s+)(\^+)( too long)(\r?\n)?$',ls[i+1])
                      if m and c:ls[i+1]=c.group(1)+'^'*len(m.group(1))+c.group(3)+(c.group(4) or '')
                  s=''.join(ls)
              p.write_bytes(s.encode('utf-8'))
          paths=sorted([p for p in Path('.').rglob('*') if '.git' not in p.parts],key=lambda p:len(p.parts),reverse=True)
          def rn(n):
              for a,b in [('eipw','sipw'),('EIPW','SIPW'),('Eipw','Sipw'),('eipv','sipv'),('EIPV','SIPV'),('Eipv','Sipv'),('eips','sips'),('EIPs','SIPs'),('ercs','srcs'),('ERCs','SRCs'),('ERCS','SRCS')]:n=n.replace(a,b)
              n=re.sub(r'(?<![A-Za-z0-9])eip(?![A-Za-z0-9])','sip',n);n=re.sub(r'(?<![A-Za-z0-9])EIP(?![A-Za-z0-9])','SIP',n);n=re.sub(r'(?<![A-Za-z0-9])erc(?![A-Za-z0-9])','src',n);n=re.sub(r'(?<![A-Za-z0-9])ERC(?![A-Za-z0-9])','SRC',n)
              return n.replace('ethereum','sila').replace('Ethereum','Sila').replace('ETHEREUM','SILA')
          for p in paths:
              if p.exists() and rn(p.name)!=p.name:
                  q=p.with_name(rn(p.name));
                  if q.exists():raise SystemExit(f'PATH_COLLISION:{p}->{q}')
                  p.rename(q)
          PY
          git add -A
          G="$(cat /tmp/gitlink)"
          git update-index --force-remove eipw-lint/dictionaries 2>/dev/null || true
          git update-index --add --cacheinfo 160000,"$G",sipw-lint/dictionaries
          python3 - <<'PY'
          from pathlib import Path
          import re
          ids=['Ethereum','ethereum','ETHEREUM','EIPs','eips','EIP','eip','ERCs','ERCS','ercs','ERC','erc','ETH','Eth','eth','Ether','ether','EIPW','Eipw','eipw','EIPV','Eipv','eipv']
          rx=re.compile(r'\b(?:'+'|'.join(map(re.escape,ids))+r')\b'); attached=re.compile(r'\b(?:EIP|eip|ERC|erc)(?=(?:[0-9]+|[Nn]\b))'); residual=[]
          for p in Path('.').rglob('*'):
              if '.git' in p.parts:continue
              if rx.search(p.as_posix()) or attached.search(p.as_posix()):residual.append('PATH:'+p.as_posix())
              if p.is_file():
                  try:s=p.read_bytes().decode('utf-8')
                  except UnicodeDecodeError:continue
                  s=re.sub(r'https?://github\.com/ethereum[A-Za-z0-9_.-]+','__THIRD_PARTY__',s)
                  if rx.search(s) or attached.search(s):residual.append('TEXT:'+p.as_posix())
          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT='+str(len(residual)))
          if residual:print('\n'.join(residual[:200]));raise SystemExit(1)
          PY
      - uses: dtolnay/rust-toolchain@1.81
        with:
          components: rustfmt, clippy
      - name: Initialize preserved third-party submodule
        run: git submodule sync --recursive && git submodule update --init --recursive
      - run: cargo check --all --all-features --locked
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features -- --deny warnings
      - run: cargo test --all --no-default-features --locked
      - run: cargo test --all --all-features --locked
      - name: Commit and publish generated authority tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'sync: latest EIPW authority 74a1df8a' || true
          git push --force origin HEAD:sila/generated-eipw-74a1df8a
